<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8912d" />
    <title>オフライン — ウェイター</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        background: #efefef;
        color: #44403c;
        text-align: center;
      }
      .card {
        max-width: 340px;
        width: 100%;
        background: #fff;
        border-radius: 16px;
        padding: 28px 20px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }
      h1 { font-size: 20px; margin-bottom: 12px; color: #1c1917; }
      p { font-size: 15px; line-height: 1.6; color: #57534e; }
      button {
        margin-top: 20px;
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: #e8912d;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>オフラインです</h1>
      <p>
        ネットワークに接続できません。Wi‑Fi または LTE を確認してから、もう一度お試しください。
      </p>
      <p style="margin-top: 12px; font-size: 13px">
        接続が戻ると、保存済みの注文は自動で送信されます。
      </p>
      <button type="button" onclick="location.reload()">再読み込み</button>
    </div>
  </body>
</html>
